<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydration Pro | Weekly Clinical Follow-up</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --shadow: 0 25px 50px rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 36px;
            box-shadow: var(--shadow);
            padding: 26px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 4px;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .brand-logo-img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(2, 132, 199, 0.15));
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .settings-icon-btn {
            background: #f0f9ff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--primary);
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-icon-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* 7-Day Flexible Check-in Circles */
        .weekly-tracker-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .weekly-tracker-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .circles-grid {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .check-circle {
            width: 36px;
            height: 36px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .check-circle.completed {
            background: #ecfdf5;
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            transform: scale(1.05);
        }

        .check-circle:active {
            transform: scale(0.92);
        }

        /* PROMINENT ENCOURAGEMENT BANNER */
        .encouragement-banner {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1.5px solid #86efac;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 14px;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08);
        }

        .encouragement-banner i {
            color: var(--success);
            font-size: 18px;
            margin-top: 2px;
        }

        .encouragement-content h4 {
            font-size: 11px;
            color: #166534;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .encouragement-content p {
            font-size: 12px;
            color: #14532d;
            font-weight: 600;
            line-height: 1.3;
        }

        /* 4 Daily Check-in Sessions Bar */
        .daily-sessions-container {
            margin-bottom: 14px;
            text-align: left;
        }

        .daily-sessions-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .session-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .session-btn span {
            font-size: 9px;
            display: block;
            color: var(--text-muted);
            font-weight: 600;
        }

        .session-btn strong {
            font-size: 11px;
            color: var(--text-main);
        }

        .session-btn.completed {
            background: #f0f9ff;
            border-color: var(--primary);
        }

        .session-btn.completed span, .session-btn.completed strong {
            color: var(--primary);
        }

        /* Settings Panel */
        .settings-panel {
            background: #f8fafc;
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            text-align: left;
            display: none;
        }

        .settings-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h4 {
            font-size: 12px;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .setting-group {
            margin-bottom: 8px;
        }

        .setting-group label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .setting-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 11px;
            outline: none;
        }

        .save-settings-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Progress Card */
        .progress-card {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-radius: 22px;
            padding: 18px;
            color: white;
            margin-bottom: 14px;
            box-shadow: 0 10px 22px rgba(2, 132, 199, 0.22);
            transition: transform 0.3s ease;
        }

        .celebration-glow {
            animation: celebratePulse 0.8s infinite alternate;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.45) !important;
        }

        @keyframes celebratePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.18);
            padding-bottom: 6px;
        }

        .stat-item h4 {
            font-size: 10px;
            opacity: 0.85;
            font-weight: 400;
        }

        .stat-item p {
            font-size: 14px;
            font-weight: 600;
        }

        .main-progress-text {
            font-size: 26px;
            font-weight: 800;
            margin: 3px 0;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            margin-top: 5px;
        }

        .progress-bar-fill {
            background: #38bdf8;
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* Quick Add Water Buttons */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: left;
            margin-bottom: 6px;
        }

        .cups-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .cup-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: 0.2s;
        }

        .cup-btn i {
            color: var(--primary);
            font-size: 13px;
        }

        .cup-btn:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .cup-btn:active {
            transform: scale(0.95);
        }

        /* Custom Add Row */
        .custom-add-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .custom-add-row input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            font-size: 12px;
            outline: none;
            background: #f8fafc;
        }

        .custom-add-row input:focus {
            border-color: var(--primary);
            background: white;
        }

        .custom-add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        /* Share Weekly Report Button */
        .btn-share {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            margin-bottom: 8px;
        }

        .btn-share:active {
            transform: scale(0.97);
        }

        /* Reset Button */
        .btn-reset {
            background: #fee2e2;
            color: #dc2626;
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-info">
                <img src="YOUR_LOGO_URL_HERE.png" alt="Logo" class="brand-logo-img" id="brandLogo">
                <div>
                    <div class="brand-title">Hydration Pro</div>
                    <div class="brand-subtitle">Weekly Clinical Follow-up</div>
                </div>
            </div>
            <button class="settings-icon-btn" onclick="toggleSettings()" title="Settings & Goals">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- 7-Day Flexible Check-in Circles -->
        <div class="weekly-tracker-box">
            <div class="weekly-tracker-title">
                <span>Clinical Week Progress</span>
                <span id="weeklyScoreText" style="color: var(--primary);">0/7 Days</span>
            </div>
            <div class="circles-grid" id="circlesGridContainer"></div>
        </div>

        <!-- Prominent Encouragement Banner -->
        <div class="encouragement-banner">
            <i class="fa-solid fa-seedling"></i>
            <div class="encouragement-content">
                <h4>Clinical Encouragement</h4>
                <p id="dynamicTipText">Consistency is your superpower! Take a refreshing sip now.</p>
            </div>
        </div>

        <!-- 4 Daily Check-in Sessions Bar -->
        <div class="daily-sessions-container">
            <div class="daily-sessions-title">Daily Check-in Sessions (<span id="sessionsCountText">0</span>/4)</div>
            <div class="sessions-grid" id="sessionsGridContainer"></div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <h4>Goal Customization</h4>
            <div class="setting-group">
                <label>Daily Goal (ml)</label>
                <input type="number" id="customGoalInput" value="2500" step="100">
            </div>
            <button class="save-settings-btn" onclick="saveSettings()">Save Changes</button>
        </div>

        <!-- Main Progress Card -->
        <div class="progress-card" id="progressCardElement">
            <div class="stats-grid">
                <div class="stat-item">
                    <h4>Goal</h4>
                    <p><span id="target-water">2500</span> ml</p>
                </div>
                <div class="stat-item">
                    <h4>Remaining</h4>
                    <p><span id="remaining-water">2500</span> ml</p>
                </div>
                <div class="stat-item">
                    <h4>Completed</h4>
                    <p id="percentage-text">0%</p>
                </div>
            </div>

            <div class="main-progress-text">
                <span id="current-water">0</span> <span style="font-size: 11px; font-weight: 400;">ml</span>
            </div>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Quick Add Section -->
        <div class="section-label">Quick Add Drinks</div>
        <div class="cups-grid">
            <button class="cup-btn" onclick="addWater(150)"><i class="fa-solid fa-glass-water"></i> +150</button>
            <button class="cup-btn" onclick="addWater(250)"><i class="fa-solid fa-bottle-water"></i> +250</button>
            <button class="cup-btn" onclick="addWater(350)"><i class="fa-solid fa-flask"></i> +350</button>
            <button class="cup-btn" onclick="addWater(500)"><i class="fa-solid fa-jug-detergent"></i> +500</button>
        </div>

        <!-- Custom Add Row -->
        <div class="custom-add-row">
            <input type="number" id="customAmountInput" placeholder="Custom ml (e.g. 200)" min="10" max="2000">
            <button class="custom-add-btn" onclick="addCustomWater()">Add</button>
        </div>

        <!-- Share Weekly Report Button -->
        <button class="btn-share" onclick="shareWeeklyReport()">
            <i class="fa-solid fa-share-nodes"></i> Share Weekly Clinical Report
        </button>

        <!-- Reset Button -->
        <button class="btn-reset" onclick="resetWater()">
            <i class="fa-solid fa-rotate-right"></i> Reset Today's Progress
        </button>
    </div>

    <script>
        let currentWater = localStorage.getItem('currentWater') ? parseInt(localStorage.getItem('currentWater')) : 0;
        let targetWater = localStorage.getItem('targetWater') ? parseInt(localStorage.getItem('targetWater')) : 2500;
        let weeklyCheckIns = JSON.parse(localStorage.getItem('weeklyCheckIns')) || [false, false, false, false, false, false, false];
        let dailySessions = JSON.parse(localStorage.getItem('dailySessions')) || [false, false, false, false];
        
        let lastResetDate = localStorage.getItem('lastResetDate');
        let todayDate = new Date().toLocaleDateString();

        if (lastResetDate !== todayDate) {
            currentWater = 0;
            dailySessions = [false, false, false, false];
            localStorage.setItem('lastResetDate', todayDate);
            localStorage.setItem('dailySessions', JSON.stringify(dailySessions));
        }

        const encouragementTips = [
            "Every sip brings you closer to your vital energy and focus!",
            "You're doing amazing! Small consistent steps create big healthy changes.",
            "Take a mindful moment, breathe, and enjoy your water break.",
            "Hydration is a gentle form of self-care. Keep glowing!",
            "Your body thanks you for every drop. Stay steady and proud!",
            "Small habits make a big clinical difference. Keep it up!",
            "Listen to your body, stay balanced, and refresh your mind."
        ];

        document.getElementById('customGoalInput').value = targetWater;
        renderWeeklyCircles();
        renderDailySessions();
        updateUI();
        setRandomTip();

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
        }

        function renderWeeklyCircles() {
            const container = document.getElementById('circlesGridContainer');
            container.innerHTML = '';
            let completedCount = 0;

            for (let i = 0; i < 7; i++) {
                if (weeklyCheckIns[i]) completedCount++;
                let circle = document.createElement('div');
                circle.className = 'check-circle';
                if (weeklyCheckIns[i]) circle.classList.add('completed');
                circle.innerHTML = weeklyCheckIns[i] ? '<i class="fa-solid fa-check"></i>' : (i + 1);
                
                circle.onclick = () => {
                    weeklyCheckIns[i] = !weeklyCheckIns[i];
                    localStorage.setItem('weeklyCheckIns', JSON.stringify(weeklyCheckIns));
                    renderWeeklyCircles();
                    setRandomTip();
                };
                container.appendChild(circle);
            }
            document.getElementById('weeklyScoreText').innerText = `${completedCount}/7 Days`;
        }

        // Render 4 Daily Check-in Sessions Grid with AUTOMATIC Weekly Sync
        function renderDailySessions() {
            const container = document.getElementById('sessionsGridContainer');
            container.innerHTML = '';
            const sessionNames = ['Morning', 'Midday', 'Afternoon', 'Evening'];
            let completedSessionsCount = 0;

            for (let i = 0; i < 4; i++) {
                if (dailySessions[i]) completedSessionsCount++;
                let btn = document.createElement('div');
                btn.className = 'session-btn';
                if (dailySessions[i]) btn.classList.add('completed');

                btn.innerHTML = `<span>${sessionNames[i]}</span><strong>${dailySessions[i] ? '✓ Done' : 'Check-in'}</strong>`;
                
                btn.onclick = () => {
                    dailySessions[i] = !dailySessions[i];
                    localStorage.setItem('dailySessions', JSON.stringify(dailySessions));
                    
                    // AUTOMATIC CHECK: If all 4 daily sessions are completed, mark the first available weekly circle automatically!
                    checkAutoWeeklySync();

                    renderDailySessions();
                    setRandomTip();
                };
                container.appendChild(btn);
            }
            document.getElementById('sessionsCountText').innerText = completedSessionsCount;
        }

        // Automatic Weekly Sync when 4/4 daily check-ins are done
        function checkAutoWeeklySync() {
            let completedSessions = dailySessions.filter(Boolean).length;
            if (completedSessions === 4) {
                let firstIncomplete = weeklyCheckIns.indexOf(false);
                if (firstIncomplete !== -1) {
                    weeklyCheckIns[firstIncomplete] = true;
                } else {
                    weeklyCheckIns[6] = true;
                }
                localStorage.setItem('weeklyCheckIns', JSON.stringify(weeklyCheckIns));
                renderWeeklyCircles();
            }
        }

        function setRandomTip() {
            const randomTip = encouragementTips[Math.floor(Math.random() * encouragementTips.length)];
            document.getElementById('dynamicTipText').innerText = randomTip;
        }

        function checkAutoCheckIn() {
            let percentage = (currentWater / targetWater) * 100;
            if (percentage >= 100) {
                let firstIncomplete = weeklyCheckIns.indexOf(false);
                if (firstIncomplete !== -1) {
                    weeklyCheckIns[firstIncomplete] = true;
                } else {
                    weeklyCheckIns[6] = true;
                }
                localStorage.setItem('weeklyCheckIns', JSON.stringify(weeklyCheckIns));
                renderWeeklyCircles();
            }
        }

        function addWater(amount) {
            currentWater += amount;
            checkAutoCheckIn();
            setRandomTip();
            saveAndSync();
        }

        function addCustomWater() {
            const input = document.getElementById('customAmountInput');
            const val = parseInt(input.value);
            if (!val || val <= 0) {
                alert("Please enter a valid ml amount.");
                return;
            }
            currentWater += val;
            input.value = '';
            checkAutoCheckIn();
            setRandomTip();
            saveAndSync();
        }

        function resetWater() {
            currentWater = 0;
            dailySessions = [false, false, false, false];
            localStorage.setItem('dailySessions', JSON.stringify(dailySessions));
            setRandomTip();
            saveAndSync();
            renderDailySessions();
        }

        function saveAndSync() {
            localStorage.setItem('currentWater', currentWater);
            localStorage.setItem('targetWater', targetWater);
            localStorage.setItem('lastResetDate', new Date().toLocaleDateString());
            updateUI();
            renderWeeklyCircles();
            renderDailySessions();
        }

        function updateUI() {
            document.getElementById('target-water').innerText = targetWater;
            document.getElementById('current-water').innerText = currentWater;
            
            let remaining = targetWater - currentWater;
            document.getElementById('remaining-water').innerText = remaining > 0 ? remaining : 0;
            
            let percentage = Math.round((currentWater / targetWater) * 100);
            if(percentage > 100) percentage = 100;
            
            document.getElementById('percentage-text').innerText = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';

            const cardEl = document.getElementById('progressCardElement');
            if (percentage >= 100) {
                cardEl.classList.add('celebration-glow');
            } else {
                cardEl.classList.remove('celebration-glow');
            }
        }

        function shareWeeklyReport() {
            let completedDays = weeklyCheckIns.filter(Boolean).length;
            let completedSessions = dailySessions.filter(Boolean).length;
            let reportText = `📊 *Weekly Clinical Hydration Report* 💧\n\n` +
                             `• Sequence Compliance: *${completedDays} / 7 Days* Completed\n` +
                             `• Today's Water: *${currentWater} ml* / ${targetWater} ml\n` +
                             `• Today's Check-ins: *${completedSessions} / 4 Sessions*\n` +
                             `• Status: *${completedDays >= 5 ? 'Excellent Compliance 🌟' : 'Steady Progress 👍'}*\n\n` +
                             `Verified via Hydration Pro Clinical Tracker.`;

            if (navigator.share) {
                navigator.share({
                    title: 'Weekly Hydration Report',
                    text: reportText,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(reportText).then(() => {
                    alert("📋 Weekly report copied to clipboard! You can paste and send it via WhatsApp.");
                });
            }
        }

        function saveSettings() {
            const newGoal = parseInt(document.getElementById('customGoalInput').value);
            if (newGoal && newGoal >= 500) {
                targetWater = newGoal;
            }
            saveAndSync();
            document.getElementById('settingsPanel').classList.remove('active');
            alert("Settings updated successfully!");
        }
    </script>
</body>
</html>
